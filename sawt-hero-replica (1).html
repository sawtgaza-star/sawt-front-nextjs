<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صوت — انميشن الهوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap">
<style>
  /* صفحة العرض فقط */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; }

  /* =========================================================
     انميشن صوت — انسخ من هون
     ========================================================= */
  .sawt-hero { width: 100%; max-width: 945px; margin: 0; }
  .sawt-hero svg { display: block; width: 100%; height: auto; overflow: visible; }
  .sawt-hero * { transform-box: view-box; }
  .sawt-hero:not(.is-live) * { animation-play-state: paused !important; }

  /* ---------- الدخول ---------- */
  .sh-in-main   { opacity: 0; transform-origin: 571px 351px; animation: sh-pop 1.1s cubic-bezier(.2,.8,.2,1) .05s forwards; }
  .sh-in-small  { opacity: 0; transform: translateX(-40px); animation: sh-slide 1s cubic-bezier(.2,.8,.2,1) .35s forwards; }
  .sh-in-badge  { opacity: 0; transform-origin: 234px 347px; transform: scale(.55); animation: sh-badge .9s cubic-bezier(.3,1.5,.5,1) .75s forwards; }
  .sh-in-branch { opacity: 0; transform-origin: 622px 690px; transform: rotate(-14deg) scale(.82); animation: sh-branch 1.3s cubic-bezier(.2,.9,.25,1.15) .6s forwards; }
  .sh-arc  { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: sh-draw 1.6s cubic-bezier(.5,0,.2,1) .4s forwards; }
  .sh-dot  { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sh-dot .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes sh-pop    { from { opacity: 0; transform: scale(.93); } to { opacity: 1; transform: none; } }
  @keyframes sh-slide  { to { opacity: 1; transform: none; } }
  @keyframes sh-badge  { to { opacity: 1; transform: none; } }
  @keyframes sh-branch { to { opacity: 1; transform: none; } }
  @keyframes sh-draw   { to { stroke-dashoffset: 0; } }
  @keyframes sh-dot    { to { opacity: 1; transform: none; } }

  /* ---------- الحركة المستمرة ---------- */
  .sh-float-small  { animation: sh-float 8s ease-in-out 1.4s infinite; }
  .sh-float-badge  { animation: sh-float 6s ease-in-out 2s infinite; }
  @keyframes sh-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .sh-sway { transform-origin: 622px 690px; animation: sh-sway 7s ease-in-out 2s infinite; }
  @keyframes sh-sway { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-1.4deg); } }

  .sh-bubble { animation: sh-bob 5s ease-in-out infinite; }
  .sh-bubble.d2 { animation-delay: -1.7s; animation-duration: 5.6s; }
  .sh-bubble.d3 { animation-delay: -3.1s; animation-duration: 6.2s; }
  @keyframes sh-bob { 0%,100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-5px); opacity: 1; } }

  .sh-bar { transform-origin: 0 360.5px; animation: sh-eq 1.2s ease-in-out infinite alternate; }
  @keyframes sh-eq { 0% { transform: scaleY(var(--lo)); } 100% { transform: scaleY(var(--hi)); } }

  .sh-mote { animation: sh-mote linear infinite; }
  @keyframes sh-mote { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: var(--o); } 85% { opacity: var(--o); } 100% { transform: translateY(-46px); opacity: 0; } }

  .sh-glow-breathe { animation: sh-breathe 4.5s ease-in-out infinite; mix-blend-mode: screen; }
  @keyframes sh-breathe { 0%,100% { opacity: .05; } 50% { opacity: .45; } }
  .sh-glow-sweep { mix-blend-mode: screen; }

  .sh-shine { animation: sh-shine 7s ease-in-out 2.5s infinite; }
  @keyframes sh-shine { 0%,72% { transform: translateX(-120px); } 92%,100% { transform: translateX(130px); } }

  .sh-warm { mix-blend-mode: screen; animation: sh-warm 5s ease-in-out infinite; }
  @keyframes sh-warm { 0%,100% { opacity: .05; } 50% { opacity: .32; } }

  .sh-ping { transform-box: fill-box; transform-origin: center; animation: sh-ping 3.2s ease-out infinite; }
  .sh-ping.d2 { animation-delay: 1.6s; }
  @keyframes sh-ping { 0% { transform: scale(1); opacity: .8; } 70%,100% { transform: scale(1.8); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .sawt-hero * { animation: none !important; }
    .sh-in-main, .sh-in-small, .sh-in-badge, .sh-in-branch, .sh-dot { opacity: 1; transform: none; }
    .sh-arc { stroke-dashoffset: 0; }
    .sh-glow-breathe, .sh-warm, .sh-ping, .sh-mote { opacity: 0; }
  }
</style>
</head>

<script>
(function () {
  var root = document.querySelector('.sawt-hero');
  if (!root) return;
  var svg = root.querySelector('svg');
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // إيقاع عشوائي لموجة الصوت
  svg.querySelectorAll('.sh-bar').forEach(function (b) {
    var lo = (0.25 + Math.random() * 0.35).toFixed(2), hi = (0.95 + Math.random() * 0.3).toFixed(2);
    b.style.setProperty('--lo', lo); b.style.setProperty('--hi', hi);
    b.style.animationDuration = (0.6 + Math.random() * 1.1).toFixed(2) + 's';
    b.style.animationDelay = (-Math.random() * 2).toFixed(2) + 's';
  });

  // غبار ضوئي
  var motes = svg.querySelector('#sh-motes');
  for (var i = 0; i < 22; i++) {
    var a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * 250;
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', (571 + Math.cos(a) * d).toFixed(1));
    c.setAttribute('cy', (351 + Math.sin(a) * d).toFixed(1));
    c.setAttribute('r', (0.6 + Math.random() * 1.1).toFixed(2));
    c.setAttribute('class', 'sh-mote');
    c.style.setProperty('--o', (0.25 + Math.random() * 0.5).toFixed(2));
    c.style.animationDuration = (5 + Math.random() * 6).toFixed(1) + 's';
    c.style.animationDelay = (-Math.random() * 10).toFixed(1) + 's';
    motes.appendChild(c);
  }

  // عدّاد الخبرة
  var count = svg.querySelector('#sh-count'), counted = false;
  function runCounter() {
    if (counted || reduce) return; counted = true;
    var t0 = null;
    count.textContent = '0+';
    setTimeout(function () {
      requestAnimationFrame(function step(ts) {
        if (!t0) t0 = ts;
        var k = Math.min(1, (ts - t0) / 1500), e = 1 - Math.pow(1 - k, 3);
        count.textContent = Math.round(e * 10) + '+';
        if (k < 1) requestAnimationFrame(step);
      });
    }, 900);
  }

  // تشغيل بس لما يبين بالشاشة
  if (svg.pauseAnimations) svg.pauseAnimations();
  if (reduce) { root.classList.add('is-live'); return; }
  function on() { root.classList.add('is-live'); svg.unpauseAnimations(); runCounter(); }
  if (!('IntersectionObserver' in window)) return on();
  new IntersectionObserver(function (en) {
    if (en[0].isIntersecting) on(); else { root.classList.remove('is-live'); svg.pauseAnimations(); }
  }, { threshold: 0.15 }).observe(root);
})();
</script>
